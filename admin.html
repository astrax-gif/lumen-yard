<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Yard | Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; height: 100vh; margin: 0; background: var(--bg-base); }
    .sidebar { width: 250px; background: var(--surface); border-right: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar a { color: var(--text); text-decoration: none; font-weight: 600; padding: 10px; border-radius: 8px; }
    .sidebar a:hover { background: var(--raise); color: var(--accent-text); }
    .content { flex: 1; padding: 40px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
    th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--line); color: var(--text); }
    th { background: var(--raise); font-weight: 700; text-transform: uppercase; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>

  <div class="sidebar">
    <div style="font-size: 20px; font-weight: 800; margin-bottom: 20px; color: var(--accent-text);">LY Command</div>
    <a href="#">Overview</a>
    <a href="#" style="background: var(--raise); border-left: 3px solid var(--accent);">Bookings</a>
    <a href="#">Floor Management</a>
    <a href="#">Settings</a>
    <a href="index.html" style="margin-top: auto; color: var(--muted);">← Back to Portal</a>
  </div>

  <div class="content">
    <h2 style="margin-top: 0;">Enterprise Bookings</h2>
    <p class="muted">Manage reservations and user preferences.</p>

    <table>
      <thead>
        <tr>
          <th>Space</th>
          <th>User</th>
          <th>Date & Time</th>
          <th>Status</th>
          <th>Preferences & Setup</th>
        </tr>
      </thead>
      <tbody id="bookings-body">
        <!-- Data populated by JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // Fetch and render bookings from your updated store.js / API
    async function loadBookings() {
      const token = localStorage.getItem('lumen_admin_token');
      if (!token) {
        alert("Please log in to view the dashboard.");
        return; // Redirect to a login modal/page in a real app
      }

      try {
        const res = await fetch('/api/admin/bookings', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        
        const tbody = document.getElementById('bookings-body');
        tbody.innerHTML = '';

        if (data.bookings && data.bookings.length > 0) {
          data.bookings.forEach(booking => {
            
            // Format preferences nicely
            const drinks = booking.drinks ? booking.drinks : 'None';
            const setup = booking.setup ? booking.setup : 'Standard';
            const extras = booking.extras && booking.extras.length > 0 ? booking.extras.join(', ') : 'No extras';

            // Determine badge color based on your hybrid setup
            let badgeColor = '#64748b'; // default gray
            if (booking.status === 'confirmed') badgeColor = '#10b981'; // green
            if (booking.status === 'pending') badgeColor = '#f59e0b'; // yellow

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${booking.space}</strong></td>
              <td>${booking.name}<br><span style="font-size: 12px; color: var(--muted);">${booking.email}</span></td>
              <td>${booking.date}<br><span style="font-size: 12px; color: var(--muted);">${booking.slot}</span></td>
              <td>
                <span style="background: ${badgeColor}33; color: ${badgeColor}; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: bold; text-transform: capitalize;">
                  ${booking.status}
                </span>
              </td>
              <td style="font-size: 13px; line-height: 1.6;">
                ☕ ${drinks} <br>
                🖥️ ${setup} <br>
                ➕ ${extras}
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px;">No bookings found.</td></tr>';
        }
      } catch (err) {
        console.error("Error loading bookings:", err);
      }
    }

    // Initialize
    loadBookings();
  </script>
</body>
</html>
