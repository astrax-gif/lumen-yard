<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space details · Tenant Portal</title>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="min-h-screen antialiased">

<header class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3">
    <a id="back" class="back-link" href="index.html"><svg class="ico" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Floor plan</a>
    <div class="fh w-10 h-10 flex items-center justify-center text-lg btn" aria-hidden="true"><span id="logoTxt">LY</span></div>
    <p id="bName" class="fh text-2xl hidden sm:block"></p>
  </div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
    <span class="ti"><svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
      <defs><mask id="tmask"><rect width="24" height="24" fill="#fff"/><circle id="tcut" cx="28" cy="-4" r="7.5" fill="#000"/></mask></defs>
      <g id="tg"><g id="trays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/>
        <line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/><line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/>
      </g><circle id="tcore" cx="12" cy="12" r="5" fill="currentColor" mask="url(#tmask)"/></g></svg></span>
    <span id="theme-label">Dark</span>
  </button>
</header>

<main id="app" class="max-w-6xl mx-auto px-4 sm:px-6 pb-20"></main>

<script src="data.js"></script>
<script src="api.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
const brand = 'co', d = B[brand], id = q.get('id');
const items = build(brand), bk = getBookings()[brand] || {};
items.forEach(u => { if (bk[u.id]) { u.free = false; u.mine = true; } });
const u = items.find(x => x.id === id);
const app = $('#app');
$('#bName').textContent = d.name; $('#logoTxt').textContent = d.mono; $('#back').href = 'index.html';

function badge(u) {
  return u.mine ? `<span class="badge badge-sel">${ic('check')}Yours</span>`
    : u.free ? `<span class="badge badge-free">${ic('check')}Free to book</span>`
    : `<span class="badge badge-occ">${ic('lock')}Taken</span>`;
}
const opts = (name, list, type, checked) => list.map((o, i) => {
  const [icon, label] = Array.isArray(o) ? o : [null, o];
  return `<label class="opt"><input type="${type}" name="${name}" value="${esc(label)}" ${checked && i === 0 ? 'checked' : ''}><span>${icon ? ic(icon) : ''}${esc(label)}</span></label>`;
}).join('');

/* Price after any active promo code is applied. Returns {base, pct, final, text} */
function priceFor(kind, promoCode) {
  const p = PRICE[kind], promo = activePromo();
  const applied = promo && promoCode && promoCode.trim().toUpperCase() === promo.code;
  const pct = applied ? promo.pct : 0;
  const final = Math.round(p.amt * (1 - pct / 100));
  return { base: p.amt, per: p.per, pct, final, applied };
}
function priceHtml(kind, promoCode) {
  const r = priceFor(kind, promoCode);
  if (!r.applied) return `AED ${r.base}/${r.per}`;
  return `<span style="text-decoration:line-through;opacity:.55">AED ${r.base}</span> AED ${r.final}/${r.per} <span class="accent font-bold">(-${r.pct}%)</span>`;
}

function render() {
  if (!u) {
    app.innerHTML = `<div class="card p-8 max-w-xl"><h1 class="fh text-4xl">Space not found</h1><p class="muted mt-2">That space is not on this floor plan.</p><a class="btn inline-block px-5 py-3 mt-5" style="text-decoration:none" href="index.html">Back to floor plan</a></div>`;
    return;
  }
  document.title = `${u.label} · ${d.name}`;
  const k = d.kinds[u.kind], P = PREFS[u.kind];
  const sibs = items.filter(x => x.kind === u.kind && x.free && x.id !== u.id).slice(0, 8);

  const left = `
    <div class="lg:col-span-3 space-y-6">
      <div class="hero-photo" style="background-image:url('${KIND_PHOTO[u.kind]}')">${badge(u)}</div>
      <div class="card p-6">
        <p class="text-sm muted flex items-center gap-1">${ic('pin')}${d.addr}</p>
        <h1 class="fh text-5xl mt-1">${u.label}</h1>
        <p class="accent font-semibold mt-1">${k[0]} · ${k[1]}</p>
        <p class="mt-4">${KIND_DESC[u.kind]}</p>
        <h2 class="fh text-2xl mt-6 mb-3">Amenities</h2>
        <ul class="grid sm:grid-cols-2 gap-2 text-sm">${AM[u.kind].map(([i, t]) => `<li class="raise flex items-center gap-2 px-3 py-2.5"><span class="accent">${ic(i)}</span>${t}</li>`).join('')}</ul>
        <h2 class="fh text-2xl mt-6 mb-3">Good to know</h2>
        <dl class="grid grid-cols-2 gap-y-2 text-sm"><dt class="muted">Rate</dt><dd class="font-semibold">${k[1]}${u.free && u.deal ? ` · ${POWER.pct}% off` : ''}</dd><dt class="muted">Capacity</dt><dd class="font-semibold">Up to ${CAPACITY[u.kind]} ${CAPACITY[u.kind] === 1 ? 'person' : 'people'}</dd>${u.kind === 'flex' || u.kind === 'priv' ? `<dt class="muted">Noise</dt><dd class="font-semibold">${ZONE[u.zone]}</dd><dt class="muted">Light</dt><dd class="font-semibold">${SUN[u.sun]}</dd>` : ''}<dt class="muted">Opening hours</dt><dd class="font-semibold">${d.hours}</dd><dt class="muted">Wi-Fi</dt><dd class="font-semibold">${d.wifi}</dd><dt class="muted">Workspace</dt><dd class="font-semibold">${d.name}</dd></dl>
      </div>
      ${sibs.length && !u.free ? `<div class="card p-6"><h2 class="fh text-2xl mb-3">Other free ${k[0].toLowerCase()} spaces</h2><div class="flex flex-wrap gap-2">${sibs.map(s => `<a class="sib" href="space.html?id=${s.id}">${s.label}</a>`).join('')}</div></div>` : ''}
    </div>`;

  let right;
  if (u.mine) {
    const b = bk[u.id];
    right = `<div class="card p-6"><span class="badge badge-sel">${ic('check')}Your booking</span><h2 class="fh text-3xl mt-3">${u.label} is yours</h2>${summary(b)}
      <button id="dlPdf" class="btn block w-full py-3 mt-3" type="button">Download confirmation (PDF)</button>
      <div class="flex gap-2 mt-3"><a class="btn flex-1 py-3 text-center" style="text-decoration:none" href="index.html">Back to floor plan</a><button id="cancel" class="raise flex-1 py-3 font-semibold">Cancel booking</button></div></div>`;
  } else if (!u.free) {
    right = `<div class="card p-6"><span class="badge badge-occ">${ic('lock')}Taken</span><h2 class="fh text-3xl mt-3">Not available</h2><p class="muted mt-2">${u.label} is already booked. Pick a free space on the plan, or use one of the links on this page.</p><a class="btn inline-block px-5 py-3 mt-5" style="text-decoration:none" href="index.html">Back to floor plan</a></div>`;
  } else {
    const today = new Date().toISOString().slice(0, 10);
    right = `<form id="form" class="card p-6 space-y-5" action="https://formspree.io/f/mgaognkb" method="POST" novalidate>
      <div><h2 class="fh text-3xl">Book ${u.label}</h2><p class="text-sm muted">Choose your preferences. The team confirms details after you reserve.</p></div>
      <div class="raise p-3 text-sm flex items-center justify-between"><span class="muted">Price</span><span id="priceVal" class="font-bold accent">${priceHtml(u.kind, '')}</span></div>
      ${u.deal ? `<div class="raise p-3 text-sm"><span class="accent font-bold">Power Hour</span> · ${POWER.pct}% off this open desk right now. Demo offer, the team confirms the final rate.</div>` : ''}
      <div><label class="block text-sm mb-1" for="date">Date</label><input id="date" name="date" type="date" min="${today}" value="${today}" class="field w-full px-3 py-2.5"/></div>
      <fieldset><legend class="text-sm mb-2">Time slot</legend><div class="flex flex-wrap gap-2">${opts('slot', SLOTS, 'radio', true)}</div></fieldset>
      <div><label class="block text-sm mb-1" for="people">Number of people</label><input id="people" type="number" min="1" max="${CAPACITY[u.kind] * 3}" value="1" class="field w-full px-3 py-2.5"/><p id="capWarn" class="text-xs mt-1 hidden" style="color:#f59e0b">${u.label} seats up to ${CAPACITY[u.kind]}. A bigger space is suggested below.</p><div id="capSuggest" class="flex flex-wrap gap-2 mt-2"></div></div>
      <fieldset><legend class="text-sm mb-2">Drinks on arrival</legend><div class="flex flex-wrap gap-2">${opts('drinks', DRINKS.map(x => [x === 'None' ? 'x' : 'coffee', x]), 'radio', true)}</div></fieldset>
      <fieldset><legend class="text-sm mb-2">${u.kind === 'room' || u.kind === 'event' ? 'Room layout' : 'Seating'}</legend><div class="flex flex-wrap gap-2">${opts('setup', P.setup, 'radio', true)}</div></fieldset>
      <fieldset><legend class="text-sm mb-2">Extras</legend><div class="flex flex-wrap gap-2">${opts('extras', P.extras, 'checkbox', false)}</div></fieldset>
      <div><label class="block text-sm mb-1" for="promo">Promo code (optional)</label><input id="promo" class="field w-full px-3 py-2.5" placeholder="Ask reception for the current code"/><p id="promoMsg" class="text-xs mt-1"></p></div>
      <div><label class="block text-sm mb-1" for="notes">Anything else? (optional)</label><textarea id="notes" name="notes" rows="2" class="field w-full px-3 py-2.5" placeholder="For example: oat milk, near a window"></textarea></div>
      <div class="grid sm:grid-cols-2 gap-3"><div><label class="block text-sm mb-1" for="fN">Full name</label><input id="fN" name="name" class="field w-full px-3 py-2.5" autocomplete="name"/></div><div><label class="block text-sm mb-1" for="fE">Email</label><input id="fE" name="email" type="email" class="field w-full px-3 py-2.5" autocomplete="email"/></div></div>
      <input type="hidden" name="message"/>
      <p id="err" class="text-sm err-text hidden" role="alert"></p>
      <button type="submit" class="btn w-full py-3.5 text-base">Reserve ${u.label}</button>
      <p class="text-xs muted text-center">No card needed for this demo — pay at reception, show your confirmation PDF.</p>
    </form>`;
  }
  app.innerHTML = `<div class="grid lg:grid-cols-5 gap-6 items-start pt-2">${left}<div class="lg:col-span-2 lg:sticky lg:top-6" id="side">${right}</div></div>`;

  const form = $('#form');
  if (form) form.addEventListener('submit', onSubmit);
  const c = $('#cancel'); if (c) c.addEventListener('click', () => { removeBooking(brand, u.id); location.reload(); });
  const dl = $('#dlPdf'); if (dl) dl.addEventListener('click', () => downloadTicket(bk[u.id]));

  const peopleEl = $('#people');
  if (peopleEl) {
    peopleEl.addEventListener('input', () => {
      const n = +peopleEl.value || 1, over = n > CAPACITY[u.kind];
      $('#capWarn').classList.toggle('hidden', !over);
      const bigger = ['flex', 'priv', 'room', 'event'].filter(kind => CAPACITY[kind] >= n);
      $('#capSuggest').innerHTML = over ? items.filter(x => x.free && bigger.includes(x.kind) && x.id !== u.id).slice(0, 6)
        .map(x => `<a class="sib" href="space.html?id=${x.id}">${x.label} · up to ${CAPACITY[x.kind]}</a>`).join('') : '';
    });
  }
  const promoEl = $('#promo');
  if (promoEl) {
    promoEl.addEventListener('input', () => {
      const m = $('#promoMsg'), val = promoEl.value.trim(), r = priceFor(u.kind, val);
      $('#priceVal').innerHTML = priceHtml(u.kind, val);
      if (!val) { m.textContent = ''; return; }
      m.textContent = r.applied ? `Applied: ${r.pct}% off` : 'Code not recognized.';
      m.style.color = r.applied ? 'var(--accent)' : '#ef4444';
    });
  }
}

function summary(b) {
  const rows = [['Reference', b.ref], ['Status', b.status || 'pending'], ['Name', b.name], ['Date', b.date], ['Time', b.slot], ['People', b.people || 1], ['Price', b.priceText || priceHtml(u.kind, '')], ['Drinks', b.drinks], ['Setup', b.setup], ['Extras', b.extras.length ? b.extras.join(', ') : 'None']];
  if (b.wifi) rows.push(['Guest Wi-Fi', b.wifi.net], ['Wi-Fi code', b.wifi.code]);
  if (b.notes) rows.push(['Notes', b.notes]);
  return `<div class="raise p-4 mt-4 text-sm space-y-1.5">${rows.map(([a, v]) => `<div class="flex justify-between gap-4"><span class="muted">${a}</span><span class="font-semibold text-right">${a === 'Price' ? v : esc(v)}</span></div>`).join('')}</div>`;
}

function downloadTicket(b) {
  if (!b) return;
  const { jsPDF } = window.jspdf, doc = new jsPDF();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text('Lumen Yard', 20, 25);
  doc.setFontSize(12); doc.setFont('helvetica', 'normal'); doc.text('Booking confirmation', 20, 33);
  doc.setLineWidth(0.5); doc.line(20, 38, 190, 38);
  const rows = [['Reference', b.ref], ['Space', u.label], ['Status', b.status || 'pending'], ['Name', b.name], ['Email', b.email], ['Date', b.date], ['Time', b.slot], ['People', String(b.people || 1)], ['Price', (b.priceText || '').replace(/<[^>]+>/g, '') || priceHtml(u.kind, '').replace(/<[^>]+>/g, '')], ['Drinks', b.drinks], ['Setup', b.setup], ['Extras', b.extras.length ? b.extras.join(', ') : 'None']];
  let y = 50;
  rows.forEach(([k, v]) => { doc.setFont('helvetica', 'bold'); doc.text(String(k) + ':', 20, y); doc.setFont('helvetica', 'normal'); doc.text(String(v || '-'), 70, y); y += 8; });
  if (b.wifi) { doc.setFont('helvetica', 'bold'); doc.text('Guest Wi-Fi:', 20, y); doc.setFont('helvetica', 'normal'); doc.text(`${b.wifi.net} / ${b.wifi.code}`, 70, y); y += 8; }
  doc.setFontSize(10); doc.setTextColor(120); doc.text('Show this at reception on arrival. Concept prototype -- not a real transaction.', 20, y + 10);
  doc.save(`${b.ref}.pdf`);
}

async function onSubmit(e) {
  e.preventDefault();
  const f = e.target, v = n => (f.querySelector(`[name="${n}"]:checked`) || {}).value, err = $('#err');
  const bad = t => { err.textContent = t; err.classList.remove('hidden'); };
  const name = $('#fN').value.trim(), email = $('#fE').value.trim();
  const people = Math.max(1, +$('#people').value || 1);
  const promoVal = $('#promo').value.trim();
  const priceInfo = priceFor(u.kind, promoVal);
  if (!$('#date').value) return bad('Choose a date.');
  if (!name) return bad('Enter your full name.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return bad('Enter a valid email address.');
  const data = {
    status: 'pending', ref: 'LY-' + Math.floor(1000 + Math.random() * 9000), name, email, date: $('#date').value,
    slot: v('slot'), drinks: v('drinks'), setup: v('setup'), people, priceText: priceHtml(u.kind, promoVal),
    notes: $('#notes').value.trim() + (promoVal ? ` | Promo entered: ${promoVal}${priceInfo.applied ? ` (-${priceInfo.pct}%, applied)` : ' (not recognized)'}` : '') + ` | People: ${people}`,
    extras: [...f.querySelectorAll('[name="extras"]:checked')].map(x => x.value)
  };
  const sb = f.querySelector('[type="submit"]'); sb.disabled = true; sb.textContent = 'Saving...';
  try {
    const r = await API.createBooking({ space: u.id, name, email, date: data.date, slot: data.slot, drinks: data.drinks, setup: data.setup, extras: data.extras, notes: data.notes });
    Object.assign(data, { ref: r.ref, status: r.status, wifi: r.wifi });
  } catch (err) {
    if (!err.offline) { sb.disabled = false; sb.textContent = `Reserve ${u.label}`; return bad(err.message); }
    data.wifi = guestWifi(d);   // no backend reachable: demo mode, saved in this browser only
  }
  f.elements.message.value = [
    `Booking request for ${u.label}`,
    `Reference: ${data.ref}`,
    `Name: ${data.name}`,
    `Email: ${data.email}`,
    `Date: ${data.date}`,
    `Time: ${data.slot}`,
    `People: ${data.people}`,
    `Drinks: ${data.drinks}`,
    `Setup: ${data.setup}`,
    `Extras: ${data.extras.length ? data.extras.join(', ') : 'None'}`,
    `Guest Wi-Fi: ${data.wifi.net} / ${data.wifi.code}`,
    `Notes: ${data.notes || 'None'}`
  ].join('\n');
  const submit = f.querySelector('[type="submit"]');
  submit.disabled = true;
  submit.textContent = 'Sending...';
  try {
    const response = await fetch(f.action, {
      method: f.method,
      body: new FormData(f),
      headers: { Accept: 'application/json' }
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.errors?.map(error => error.message).join(', ') || 'The booking request could not be sent. Please try again.');
  } catch (error) {
    submit.disabled = false;
    submit.textContent = `Reserve ${u.label}`;
    return bad(error.message || 'The booking request could not be sent. Please try again.');
  }
  saveBooking(brand, u.id, data);
  $('#side').innerHTML = `<div class="card p-6 text-center"><div class="w-14 h-14 rounded-full btn mx-auto flex items-center justify-center mb-4"><svg class="ico" style="width:28px;height:28px;stroke-width:3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2 class="fh text-3xl">You're booked in</h2><p class="muted text-sm mt-2">Check in at reception on level ${d.floor}. A confirmation was sent to ${esc(email)}.</p>
    <div class="text-left">${summary(data)}</div>
    <button id="dlPdf" class="btn block w-full py-3 mt-3" type="button">Download confirmation (PDF)</button>
    <a class="btn block py-3 mt-3" style="text-decoration:none" href="index.html">Back to floor plan</a></div>`;
  $('#dlPdf').addEventListener('click', () => downloadTicket(data));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render(); initTheme();
</script>
</body>
</html>
